<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" role="img" aria-labelledby="title desc">
  <title id="title">TeensyELS Mk2 keypad layout</title>
  <desc id="desc">A three by three keypad. Top row: MODE, RATE, STOPS — the selectors, which choose what the arrows drive. Middle row: left arrow, OK, right arrow — the actuators. Bottom row: HALT, MENU, ENABLE — machine state. Small numbers in each key corner are the matrix scan codes.</desc>

  <defs>
    <style>
      .bg     { fill: #11151a; }
      .key    { fill: #1c232c; stroke: #38424f; stroke-width: 1.5; rx: 10; }
      .kSel   { fill: #17293c; stroke: #2f6fa8; }
      .kAct   { fill: #14302c; stroke: #2f8f7a; }
      .kHalt  { fill: #331a1c; stroke: #a8443f; }
      .kEnab  { fill: #16301c; stroke: #3d8f4a; }
      .name   { fill: #eaf0f6; font-size: 26px; font-weight: 600; text-anchor: middle;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .sub    { fill: #8fa0b3; font-size: 12.5px; text-anchor: middle;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .code   { fill: #5b6b7d; font-size: 11px; text-anchor: end;
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .band   { fill: #7f90a3; font-size: 12px; font-weight: 600; letter-spacing: 1.4px;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .bandsub{ fill: #66798c; font-size: 12px;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .head   { fill: #eaf0f6; font-size: 19px; font-weight: 600;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .foot   { fill: #7b8b9d; font-size: 12.5px;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .rule   { stroke: #2a323c; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="540"/>

  <text class="head" x="40" y="46">Mk2 front panel — nine keys</text>
  <text class="foot" x="40" y="68">Selectors choose what the arrows drive. The arrows are the only keys that move the carriage.</text>

  <!-- ── Row 1: selectors ─────────────────────────────────────────── -->
  <g>
    <rect class="key kSel" x="40"  y="96" width="152" height="94"/>
    <text class="code" x="182" y="115">9</text>
    <text class="name" x="116" y="145">MODE</text>
    <text class="sub"  x="116" y="168">feed · thread R · thread L</text>

    <rect class="key kSel" x="212" y="96" width="152" height="94"/>
    <text class="code" x="354" y="115">17</text>
    <text class="name" x="288" y="145">RATE</text>
    <text class="sub"  x="288" y="168">pitch / feed rate</text>

    <rect class="key kSel" x="384" y="96" width="152" height="94"/>
    <text class="code" x="526" y="115">33</text>
    <text class="name" x="460" y="145">STOPS</text>
    <text class="sub"  x="460" y="168">endstops · hold to clear</text>
  </g>
  <text class="band"    x="560" y="136">SELECTORS</text>
  <text class="bandsub" x="560" y="156">open a panel; press</text>
  <text class="bandsub" x="560" y="172">again to close</text>

  <!-- ── Row 2: actuators ─────────────────────────────────────────── -->
  <g>
    <rect class="key kAct" x="40"  y="206" width="152" height="94"/>
    <text class="code" x="182" y="225">10</text>
    <text class="name" x="116" y="255">◀</text>
    <text class="sub"  x="116" y="278">jog · run to stop</text>

    <rect class="key kAct" x="212" y="206" width="152" height="94"/>
    <text class="code" x="354" y="225">18</text>
    <text class="name" x="288" y="255">OK</text>
    <text class="sub"  x="288" y="278">jog speed · hold to zero</text>

    <rect class="key kAct" x="384" y="206" width="152" height="94"/>
    <text class="code" x="526" y="225">34</text>
    <text class="name" x="460" y="255">▶</text>
    <text class="sub"  x="460" y="278">jog · run to stop</text>
  </g>
  <text class="band"    x="560" y="246">ACTUATORS</text>
  <text class="bandsub" x="560" y="266">the only keys that</text>
  <text class="bandsub" x="560" y="282">move the carriage</text>

  <!-- ── Row 3: machine state ─────────────────────────────────────── -->
  <g>
    <rect class="key kHalt" x="40"  y="316" width="152" height="94"/>
    <text class="code" x="182" y="335">12</text>
    <text class="name" x="116" y="365">HALT</text>
    <text class="sub"  x="116" y="388">always live</text>

    <rect class="key" x="212" y="316" width="152" height="94"/>
    <text class="code" x="354" y="335">20</text>
    <text class="name" x="288" y="365">MENU</text>
    <text class="sub"  x="288" y="388">carousel · wraps around</text>

    <rect class="key kEnab" x="384" y="316" width="152" height="94"/>
    <text class="code" x="526" y="335">36</text>
    <text class="name" x="460" y="365">ENABLE</text>
    <text class="sub"  x="460" y="388">engage the leadscrew</text>
  </g>
  <text class="band"    x="560" y="356">MACHINE STATE</text>
  <text class="bandsub" x="560" y="376">the two keys that stay</text>
  <text class="bandsub" x="560" y="392">live while moving</text>

  <line class="rule" x1="40" y1="444" x2="740" y2="444"/>
  <text class="foot" x="40" y="470">Small numbers are the matrix scan codes (code = H | V &lt;&lt; 3): H rows on GPIO 32 / 33 / 2,</text>
  <text class="foot" x="40" y="492">V columns on GPIO 13 / 14 / 15. Hold <tspan style="font-family: ui-monospace, monospace; fill:#a9b8c8">OK</tspan> (code 18, the centre key) at power-on to boot into Wi-Fi setup.</text>
  <text class="foot" x="40" y="514">While the carriage is under power only HALT and ENABLE respond — see “While the carriage is moving”.</text>
</svg>
