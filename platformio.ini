; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native

[env:esp32dev_publish]
platform = espressif32
board = lilygo-t-display
build_type = release
monitor_filters = esp32_exception_decoder
framework = arduino
upload_protocol = custom
; Publishing is now a GitHub release (see scripts/release.sh). Running
;   pio run -e esp32dev_publish -t upload
; builds then publishes the firmware.bin as release asset elstft.bin, which the
; OTA updater pulls from the "latest" release permalink. Requires git-bash + gh.
upload_command = bash scripts/release.sh
lib_deps = 
	https://github.com/martinlong1978/ESP32Encoder.git
	khoih-prog/ESP32TimerInterrupt@^2.3.0
	bodmer/TFT_eSPI@^2.5.43
	suculent/ESP32httpUpdate@^2.1.145
	lvgl/lvgl@^9.4.0
board_build.partitions = my_4MB.csv
build_flags = 
	; lib/display includes <version.h> for the About screen. PlatformIO puts the
	; project include/ dir on the path for src/ but NOT for lib/ libraries.
	-I include
	'-D USER_SETUP_LOADED'
	'-D USER_SETUP_INFO="User_Setup"'
	'-D ST7789_DRIVER'
	'-D TFT_SDA_READ'
	'-D TFT_WIDTH=240'
	'-D TFT_HEIGHT=320'
	'-D TFT_MOSI=19'
	'-D TFT_SCLK=18'
	'-D TFT_CS=5'
	'-D TFT_DC=16'
	'-D TFT_RST=23'
	'-D TFT_BL=4' 
	'-D SPI_FREQUENCY=80000000'
	'-D SPI_READ_FREQUENCY=20000000'
	'-D SPI_TOUCH_FREQUENCY=2500000'
	'-D TFT_INVERSION_OFF'

[env:esp32dev_usb]
platform = espressif32
board = lilygo-t-display
build_type = release
monitor_filters = esp32_exception_decoder
framework = arduino
lib_deps = 
	https://github.com/martinlong1978/ESP32Encoder.git
	khoih-prog/ESP32TimerInterrupt@^2.3.0
	bodmer/TFT_eSPI@^2.5.43
	suculent/ESP32httpUpdate@^2.1.145
	lvgl/lvgl@^9.4.0
upload_port = COM14
monitor_speed = 921600
board_build.partitions = my_4MB.csv
build_flags = 
	; lib/display includes <version.h> for the About screen. PlatformIO puts the
	; project include/ dir on the path for src/ but NOT for lib/ libraries.
	-I include
	'-D USER_SETUP_LOADED'
	'-D USER_SETUP_INFO="User_Setup"'
	'-D ST7789_DRIVER'
	'-D TFT_SDA_READ'
	'-D TFT_WIDTH=240'
	'-D TFT_HEIGHT=320'
	'-D TFT_MOSI=19'
	'-D TFT_SCLK=18'
	'-D TFT_CS=5'
	'-D TFT_DC=16'
	'-D TFT_RST=23'
	'-D TFT_BL=4' 
	'-D SPI_FREQUENCY=80000000'
	'-D SPI_READ_FREQUENCY=20000000'
	'-D SPI_TOUCH_FREQUENCY=2500000'
	'-D TFT_INVERSION_OFF'

[env:native]
platform = native@1.2.1
test_framework = googletest
build_type = debug
debug_test = *
build_flags = -Wp,-w -D PIO_UNIT_TESTING=1 -I test/stubs
debug_build_flags = -O0 -g -ggdb
extra_scripts = pre:scripts/exclude_espspindle_native.py
; Host unit tests only need googletest. The display/web libraries are ESP32-only
; (RPAsyncTCP -> WiFi.h/Client.h) and cannot build for the native platform, so
; they are excluded from this env and from the LDF scan.
lib_ignore =
	lvgl
	ESPAsyncWebServer
	RPAsyncTCP
	AsyncTCP
	TFT_eSPI
lib_deps =
	google/googletest@^1.15.2
